<!DOCTYPE html>
<html lang="th">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio - ธีรภัทร พลอาจหาญ</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px 60px;
      background: #f05000;
    }

    .portfolio {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .portfolio img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <main class="portfolio">
    <img src="1.png" alt="หน้า 1">

    <img src="7.png" alt="หน้า 7" loading="lazy">
    <img src="8.png" alt="หน้า 8" loading="lazy">
    <img src="9.png" alt="หน้า 9" loading="lazy">
    <img src="10.png" alt="หน้า 10" loading="lazy">

</html>
